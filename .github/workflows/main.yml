name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    paths:
      - "**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update package lists
        run: sudo apt-get update

      - name: Install dependencies & QEMU emulation
        run: >-
          sudo apt-get install -y coreutils quilt parted kpartx qemu-utils
          qemu-user-static binfmt-support debootstrap zerofree zip dosfstools
          libarchive-tools libcap2-bin grep rsync xz-utils file git curl bc

      - name: Set up QEMU binfmt
        run: sudo update-binfmts --enable qemu-aarch64 || true

      - name: Build image
        run: |
          chmod +x build.sh build-docker.sh stage*/*.sh stage*/*/*.sh 2>/dev/null || true
          touch stage3/EXPORT_IMAGE
          sudo ./build.sh

      - name: Upload image artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: images-qemu
          path: deploy/*.zip
          if-no-files-found: warn

      - name: Upload deb artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debs-qemu
          path: deploy/*.deb
          if-no-files-found: ignore
