name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    paths:
      - "**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update package lists
        run: sudo apt-get update

      - name: Install dependencies
        run: >-
          sudo apt-get install -y coreutils quilt parted kpartx qemu-utils
          qemu-user debootstrap zerofree zip dosfstools libarchive-tools
          libcap2-bin grep rsync xz-utils file git curl bc

      - name: Prepare ccache directory
        run: mkdir -p .ccache

      - name: Set up ccache cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ github.head_ref }}-${{ github.run_number }}
          restore-keys: |
            ccache-${{ github.head_ref }}
            ccache

      - name: Build image
        run: |
          chmod +x build.sh build-docker.sh stage*/*.sh stage*/*/*.sh 2>/dev/null || true
          if [ -f "./build.sh" ]; then
            sudo bash ./build.sh
          else
            sudo bash ./build-docker.sh
          fi

      - name: Upload image artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: images-qemu
          path: deploy/*.zip
          if-no-files-found: ignore

      - name: Upload deb artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debs-qemu
          path: deploy/*.deb
          if-no-files-found: ignore
