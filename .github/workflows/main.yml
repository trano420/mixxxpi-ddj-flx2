name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    paths:
      - "**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update package lists
        run: sudo apt-get update

      - name: Install dependencies & QEMU emulation
        run: >-
          sudo apt-get install -y coreutils quilt parted kpartx qemu-utils
          qemu-user-static binfmt-support debootstrap zerofree zip
          dosfstools libarchive-tools libcap2-bin grep rsync xz-utils file git curl bc

      - name: Build image
        run: |
          # Symlink QEMU binaries to match pi-gen's hardcoded paths
          sudo ln -sf /usr/bin/qemu-arm-static /usr/bin/qemu-arm 2>/dev/null || true
          sudo ln -sf /usr/bin/qemu-aarch64-static /usr/bin/qemu-aarch64 2>/dev/null || true

          chmod +x build.sh build-docker.sh stage*/*.sh stage*/*/*.sh export-image/*.sh export-image/*/*.sh scripts/* 2>/dev/null || true
          
          # Force pi-gen to export stage3 as the final image
          touch stage3/EXPORT_IMAGE
          rm -f stage0/EXPORT_IMAGE stage1/EXPORT_IMAGE stage2/EXPORT_IMAGE 2>/dev/null || true

          # Define dummy dependencies_check function for pi-gen
          if [ -f "scripts/dependencies_check" ]; then
            echo -e 'dependencies_check() {\n  return 0\n}' | sudo tee scripts/dependencies_check > /dev/null
            sudo chmod +x scripts/dependencies_check
          fi

          # Remove obsolete bookworm package references
          find stage2/ -name "00-packages*" -exec sed -i '/rpi-swap/d; /rpi-loop-utils/d; /rpi-usb-gadget/d' {} +
          find stage* -type f -name "*.sh" -exec sed -i -E '/rpi-resize/ s/$/ || true/' {} +

          # Run build
          sudo ./build.sh

      - name: Upload image artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mixxxpi-ddj-flx2-image
          path: deploy/*.zip
          if-no-files-found: warn

      - name: Upload img file if uncompressed
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mixxxpi-ddj-flx2-raw-img
          path: deploy/*.img*
          if-no-files-found: ignore
